<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --navy:#142534;
    --teal-dark:#0E5663;
    --teal:#18A999;
    --muted:#6B7A86;
    --border:#DCE7EA;
    --danger:#D64545;
    --bg:#F8FBFC;
  }
  html, body { margin:0; padding:0; background:transparent; font-family:Arial, sans-serif; overflow:hidden; }
  .voice-wrap {
    width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:12px;
    background:rgba(255,255,255,.92); padding:7px 8px;
    box-shadow:0 8px 18px rgba(15,74,85,.08);
  }
  .voice-top { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .voice-title { color:var(--teal-dark); font-size:10px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .voice-status { font-size:9px; color:var(--muted); text-align:right; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .voice-status.ok { color:#047857; font-weight:800; }
  .voice-status.err { color:var(--danger); font-weight:800; }
  .voice-buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-top:5px; }
  .voice-buttons.hidden { display:none; }
  button {
    border:0; border-radius:10px; min-height:25px; padding:3px 4px;
    font-size:10px; font-weight:850; color:white;
    background:linear-gradient(135deg,var(--teal-dark),var(--teal)); cursor:pointer;
  }
  button.secondary { background:#eef7f6; color:var(--teal-dark); border:1px solid rgba(14,86,99,.16); }
  button.danger { background:#fff1f1; color:#991b1b; border:1px solid rgba(214,69,69,.22); }
  button:disabled { opacity:.50; cursor:not-allowed; }
  .transcript { margin-top:5px; padding:5px 7px; border-radius:10px; background:var(--bg); color:var(--navy); font-size:9px; line-height:1.22; min-height:14px; }
  .hint { margin-top:4px; color:var(--muted); font-size:8.5px; line-height:1.20; }
  .pulse { display:inline-block; width:7px; height:7px; border-radius:999px; background:var(--teal); margin-right:4px; box-shadow:0 0 0 0 rgba(24,169,153,.65); animation:pulse 1.3s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(24,169,153,.65)} 70%{box-shadow:0 0 0 8px rgba(24,169,153,0)} 100%{box-shadow:0 0 0 0 rgba(24,169,153,0)} }
</style>
</head>
<body>
<div class="voice-wrap">
  <div class="voice-top">
    <div class="voice-title">Voice Picking</div>
    <div id="status" class="voice-status">Listo</div>
  </div>
  <div id="controls" class="voice-buttons">
    <button id="speakBtn" type="button">🔊 Repetir</button>
    <button id="listenBtn" type="button" class="secondary">🎙️ Hablar</button>
    <button id="stopBtn" type="button" class="danger">■ Parar</button>
  </div>
  <div id="transcript" class="transcript">Comandos disponibles.</div>
  <div id="hint" class="hint">Espere a que termine la instrucción y responda.</div>
</div>
<script>
let args = {};
let renderedOnce = false;
let lastAutoPlayNonce = null;
let lastListenNonce = null;
let recognition = null;
let listening = false;
let speaking = false;
let lastCommandTs = 0;

const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const hintEl = document.getElementById('hint');
const controlsEl = document.getElementById('controls');
const speakBtn = document.getElementById('speakBtn');
const listenBtn = document.getElementById('listenBtn');
const stopBtn = document.getElementById('stopBtn');

function sendMessage(type, data) { window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, '*'); }
function componentReady() { sendMessage('streamlit:componentReady', { apiVersion: 1 }); }
function setFrameHeight(height) { sendMessage('streamlit:setFrameHeight', { height }); }
function setComponentValue(value) { sendMessage('streamlit:setComponentValue', { value, dataType: 'json' }); }
function setStatus(text, cls='') { statusEl.innerHTML = text; statusEl.className = 'voice-status ' + cls; }
function setTranscript(text) { transcriptEl.textContent = text || ''; }
function setHint(text) { hintEl.textContent = text || ''; }

function normalize(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[.,;:!¿?¡]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function parseQuantity(text) {
  const t = normalize(text).replace(',', '.');
  const num = t.match(/\b\d+(?:\.\d+)?\b/);
  if (num) return parseFloat(num[0]);
  const words = {
    'cero':0,'uno':1,'una':1,'un':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,
    'once':11,'doce':12,'trece':13,'catorce':14,'quince':15,'dieciseis':16,'diecisiete':17,'dieciocho':18,'diecinueve':19,
    'veinte':20,'veintiuno':21,'veintidos':22,'veintitres':23,'veinticuatro':24,'veinticinco':25,'veintiseis':26,'veintisiete':27,'veintiocho':28,'veintinueve':29,
    'treinta':30,'cuarenta':40,'cincuenta':50,'sesenta':60,'setenta':70,'ochenta':80,'noventa':90,'cien':100,'ciento':100
  };
  if (Object.prototype.hasOwnProperty.call(words, t)) return words[t];
  const parts = t.split(' ');
  let total = 0;
  for (const p of parts) {
    if (Object.prototype.hasOwnProperty.call(words, p)) total += words[p];
  }
  if (total > 0) return total;
  return null;
}
function commandFromText(text) {
  const t = normalize(text);
  if (!t) return '';
  if (/(cancelar picking|cancela picking|cancelar el picking|cancelar proceso|cancelar el proceso|cancelar|salir|detener|parar)/.test(t)) return 'CANCELAR_PICKING';
  if (/(iniciar|empezar|comenzar|arrancar)/.test(t)) return 'INICIAR';
  if (/(estoy aqui|ya estoy|aqui estoy|llegue|llegué|estoy en la ubicacion|estoy en ubicacion)/.test(t)) return 'ESTOY_AQUI';
  if (/(repite ubicacion|repetir ubicacion|repita ubicacion|repite la ubicacion|repetir la ubicacion)/.test(t)) return 'REPETIR_UBICACION';
  if (/(repite codigo|repetir codigo|repita codigo|repite material|repetir material|repite el codigo)/.test(t)) return 'REPETIR_CODIGO';
  if (/(repite cantidad|repetir cantidad|repita cantidad|repite la cantidad)/.test(t)) return 'REPETIR_CANTIDAD';
  if (/(confirmar auditoria|cerrar picking|finalizar auditoria|terminar auditoria|confirmo auditoria|confirmar la auditoria)/.test(t)) return 'CONFIRMAR_AUDITORIA';
  if (/(confirmar corto|confirmo corto|aceptar corto|guardar corto|confirma corto)/.test(t)) return 'CONFIRMAR_CORTO';
  if (/(tengo corto|hay corto|corto|falta|faltante|no hay|no encuentro|incompleto|diferencia)/.test(t)) return 'CORTO';
  if (/(ok|okay|correcto|conforme|esta bien|está bien|listo|hecho|vale)/.test(t)) return 'OK';
  if (/(confirmar|confirmo|si confirmo|aceptar)/.test(t)) return 'CONFIRMAR';
  if (/(repetir|repite|otra vez|de nuevo|repitelo|repítelo|repita)/.test(t)) return 'REPETIR';
  if (/(ayuda|comandos|opciones|que puedo decir|qué puedo decir)/.test(t)) return 'AYUDA';
  if (/\b(si|sí)\b/.test(t)) return 'SI';
  if (/(no|negativo|continuar)/.test(t)) return 'NO';
  const qty = parseQuantity(t);
  if (qty !== null) return 'CANTIDAD';
  return 'NO_RECONOCIDO';
}
function stopAll() {
  try { if (recognition) recognition.stop(); } catch(e) {}
  try { window.speechSynthesis.cancel(); } catch(e) {}
  listening = false;
  speaking = false;
  setStatus('Detenido');
}
function chooseVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (!voices || !voices.length) return null;
  const lang = String(args.lang || 'es-PE').toLowerCase();
  return voices.find(v => String(v.lang || '').toLowerCase() === lang)
      || voices.find(v => String(v.lang || '').toLowerCase().startsWith('es'))
      || voices[0];
}
function speakInstruction(autoListen=false) {
  const text = String(args.instruction || '').trim();
  if (!text || !('speechSynthesis' in window)) {
    setStatus('Síntesis no disponible', 'err');
    return;
  }
  stopAll();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = args.lang || 'es-PE';
  utter.rate = Number(args.rate || 1.25);
  utter.pitch = Number(args.pitch || 1.0);
  utter.volume = Number(args.volume || 1.0);
  const voice = chooseVoice();
  if (voice) utter.voice = voice;
  utter.onstart = () => { speaking = true; setStatus('Hablando...'); };
  utter.onend = () => {
    speaking = false;
    setStatus(autoListen ? 'Escuchando...' : 'Listo');
    if (args.emit_played) setComponentValue({ event:'played', ts: Date.now(), task_key: args.task_key || '' });
    if (autoListen) setTimeout(() => startListening(), Number(args.listen_delay_ms || 260));
  };
  utter.onerror = () => { speaking = false; setStatus('Error de audio', 'err'); };
  window.speechSynthesis.speak(utter);
}
function makeRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.lang = args.lang || 'es-PE';
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;
  return rec;
}
function startListening() {
  const rec = makeRecognition();
  if (!rec) {
    setStatus('Reconocimiento no disponible en Chrome', 'err');
    setComponentValue({ event:'speech_not_supported', ts: Date.now(), task_key: args.task_key || '' });
    return;
  }
  try { if (recognition) recognition.stop(); } catch(e) {}
  recognition = rec;
  listening = true;
  setStatus('<span class="pulse"></span>Escuchando...');
  setTranscript('Escuchando: ' + (args.commands_hint || 'responda ahora'));
  const timeoutMs = Number(args.listen_timeout_ms || 6500);
  const timeout = setTimeout(() => { try { rec.stop(); } catch(e) {} }, timeoutMs);
  rec.onresult = (event) => {
    clearTimeout(timeout);
    listening = false;
    const result = event.results && event.results[0] ? event.results[0] : null;
    let transcript = '';
    let confidence = 0;
    if (result && result[0]) {
      transcript = result[0].transcript || '';
      confidence = result[0].confidence || 0;
    }
    const command = commandFromText(transcript);
    const qty = parseQuantity(transcript);
    const now = Date.now();
    if (now - lastCommandTs < 250) return;
    lastCommandTs = now;
    setTranscript('Reconocido: ' + transcript + ' → ' + command);
    setStatus(command === 'NO_RECONOCIDO' ? 'No reconocido' : 'Comando reconocido', command === 'NO_RECONOCIDO' ? 'err' : 'ok');
    setComponentValue({
      event:'command',
      transcript,
      command,
      quantity: qty,
      confidence,
      ts: now,
      task_key: args.task_key || ''
    });
  };
  rec.onerror = (e) => {
    clearTimeout(timeout);
    listening = false;
    setStatus('Error micrófono: ' + (e.error || ''), 'err');
    setComponentValue({ event:'recognition_error', error:e.error || '', ts: Date.now(), task_key: args.task_key || '' });
  };
  rec.onend = () => {
    clearTimeout(timeout);
    if (listening) setStatus('Sin comando detectado');
    listening = false;
  };
  try { rec.start(); } catch(e) { setStatus('No se pudo escuchar', 'err'); }
}

speakBtn.onclick = () => speakInstruction(false);
listenBtn.onclick = () => startListening();
stopBtn.onclick = () => stopAll();

window.addEventListener('message', (event) => {
  if (!event.data || event.data.type !== 'streamlit:render') return;
  args = event.data.args || {};
  setFrameHeight(Number(args.height || 92));
  if (!renderedOnce) {
    componentReady();
    renderedOnce = true;
  }
  controlsEl.className = args.show_controls ? 'voice-buttons' : 'voice-buttons hidden';
  setHint(args.commands_hint || 'Espere la instrucción y responda.');
  if (!('speechSynthesis' in window)) setStatus('Voz de salida no disponible', 'err');
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    setTranscript('Reconocimiento de voz no disponible. Usa Chrome actualizado o confirma manualmente.');
  }
  if (args.auto_play && args.auto_play_nonce !== lastAutoPlayNonce) {
    lastAutoPlayNonce = args.auto_play_nonce;
    setTimeout(() => speakInstruction(Boolean(args.auto_listen)), Number(args.auto_delay_ms || 140));
  }
  if (args.listen_nonce && args.listen_nonce !== lastListenNonce) {
    lastListenNonce = args.listen_nonce;
    setTimeout(() => startListening(), 90);
  }
});
componentReady();
setFrameHeight(92);
</script>
</body>
</html>
